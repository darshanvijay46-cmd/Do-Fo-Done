kind = "web"
previewPath = "/"
title = "FocusFlow"
description = "An offline-friendly personal productivity app that connects sticky-note tasks, scheduling, focus sessions, workouts, projects, and real activity analytics in one calm daily planner."
version = "1.0.0"
id = "artifacts/focus-flow"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21625

[services.development]
run = "pnpm --filter @workspace/focus-flow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/focus-flow", "run", "build" ]
serve = "static"
publicDir = "artifacts/focus-flow/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21625"
BASE_PATH = "/"
